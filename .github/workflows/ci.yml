name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile scripts/transcribe_video_long.py
      - name: Check CLI help
        run: python scripts/transcribe_video_long.py --help
      - name: Check installer syntax
        run: bash -n scripts/install_macos.sh
      - name: Check doctor JSON output shape
        run: python scripts/transcribe_video_long.py doctor --json || true
